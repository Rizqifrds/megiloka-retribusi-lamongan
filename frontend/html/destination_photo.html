{% if dest.image_url %}
<img src="{{ dest.image_url }}" alt="{{ dest.name }}" class="dest-img w-100 h-100 object-fit-cover" loading="lazy"
     onerror="this.style.display='none';this.nextElementSibling.hidden=false">
{% endif %}
<div class="bg-primary-subtle text-primary h-100 text-center py-5" {% if dest.image_url %}hidden{% endif %}>
    <i class="fa-regular fa-image d-block mb-2" aria-hidden="true"></i>
    <span class="small">Foto belum tersedia</span>
</div>
